# Serves the DJ SPA inside this image.
#
# This app owns "/" on the hostname. The couple intake app
# (Vikteur/rekord-couple) owns /g/ and /guest/, and the API
# (Vikteur/spotify-to-rekordbox) owns /api/ — the edge proxy routes those
# elsewhere and they never reach this container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container health check — never reaches the SPA.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed bundle files: safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single page app: every other path is the DJ UI.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
